<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>PEV English Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow workbook column; each step is a sheet section on faint graph paper, stickers for state. */
:root {
  --paper: #f5f8fb; --sheet: #ffffff; --ink: #1d2a44; --muted: #5b6782; --line: #c9d3e2; --soft: #e8eef6;
  --accent: #0d7a63; --accent-ink: #ffffff; --mark: #ffe27a; --good: #1c8a4a; --bad: #c2412d; --good-bg: #e3f4ea; --bad-bg: #fbe6e1;
  --grid: rgba(29, 42, 68, .045);
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Lexend", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121826; --sheet: #1a2233; --ink: #e8edf6; --muted: #a3afc4; --line: #34405a; --soft: #26304a;
  --accent: #3cc49f; --accent-ink: #0b1a14; --mark: #6b5a12; --good: #57d18b; --bad: #ff8a73; --good-bg: #183528; --bad-bg: #3d211c;
  --grid: rgba(232, 237, 246, .04); color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #121826; --sheet: #1a2233; --ink: #e8edf6; --muted: #a3afc4; --line: #34405a; --soft: #26304a;
  --accent: #3cc49f; --accent-ink: #0b1a14; --mark: #6b5a12; --good: #57d18b; --bad: #ff8a73; --good-bg: #183528; --bad-bg: #3d211c;
  --grid: rgba(232, 237, 246, .04); color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet) }
.wrap { max-width: 820px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--line) }
header.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
header.top img { width: 34px; height: 34px; object-fit: contain }
header.top .brand { font-family: var(--display); font-weight: 800; font-size: 1.2rem; line-height: 1.1 }
header.top .brand small { display: block; font-family: var(--body); font-weight: 400; font-size: .72rem; color: var(--muted) }
header.top .sp { flex: 1 }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0 }
h1 { font-size: 2rem; font-weight: 800 } h2 { font-size: 1.45rem; font-weight: 800 } h3 { font-size: 1.12rem; font-weight: 700 }
.muted { color: var(--muted) }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
.btn { border: 2px solid var(--ink); background: var(--sheet); border-radius: 999px; padding: 8px 18px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.btn.small { padding: 4px 12px; font-size: .85rem }
.btn:focus-visible, .opt:focus-visible, input:focus-visible, select:focus-visible, .tile:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px }
.btn[disabled] { opacity: .5; cursor: default }
.stack { display: flex; flex-direction: column; gap: 18px }
.sheet { background: var(--sheet); border: 1.5px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0 }
.sec-head { display: flex; align-items: center; gap: 10px; margin-top: 18px }
.pill { display: inline-block; background: var(--mark); color: var(--ink); border-radius: 999px; padding: 2px 14px; font-family: var(--display); font-weight: 800; font-size: 1.25rem }
.bubble-row { display: flex; gap: 12px; align-items: flex-start }
.face { flex: none; width: 44px; height: 44px }
.bubble { position: relative; background: var(--sheet); border: 2px solid var(--ink); border-radius: 18px; padding: 10px 14px; min-width: 0 }
.bubble::before { content: ""; position: absolute; left: -9px; top: 14px; width: 14px; height: 14px; background: var(--sheet); border-left: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: rotate(45deg) }
/* home */
.hero { padding-block: 40px 8px; display: grid; gap: 18px }
.code-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.code-input { font-family: var(--display); font-weight: 800; font-size: 1.8rem; letter-spacing: .3em; text-transform: uppercase; width: 9.5em; max-width: 100%; padding: 6px 14px; border: 2px solid var(--ink); border-radius: 12px; background: var(--sheet) }
.err { color: var(--bad); font-weight: 500 }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px }
.how .sheet { padding: 14px }
.how b { font-family: var(--display); font-size: 1.05rem }
/* list */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px }
.tile { text-align: left; background: var(--sheet); border: 2px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 6px; }
.tile:hover { border-color: var(--ink) }
.tile .nm { font-family: var(--display); font-weight: 800; font-size: 1.3rem }
.badge { display: inline-block; font-size: .78rem; font-weight: 600; border-radius: 999px; padding: 1px 10px; border: 1.5px solid var(--ink) }
.badge.lu { background: var(--mark) }
.badge.done { background: var(--good-bg); border-color: var(--good); color: var(--good) }
/* cards */
.card { display: grid; gap: 10px }
.card .hd { display: flex; flex-wrap: wrap; align-items: center; gap: 8px }
.card .hd .sp { flex: 1 }
.qn { font-family: var(--display); font-weight: 800; background: var(--ink); color: var(--sheet); border-radius: 999px; padding: 0 10px; font-size: .95rem }
.qimg { display: block; max-width: min(100%, 720px); height: auto; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: zoom-in }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.opt { min-width: 48px; border: 2px solid var(--ink); background: var(--sheet); border-radius: 12px; padding: 6px 14px; font-weight: 600 }
.opt[aria-pressed="true"] { background: var(--ink); color: var(--sheet) }
.opt.right { background: var(--good-bg); border-color: var(--good); color: var(--good) }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad) }
.fb { border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px }
.fb.ok { background: var(--good-bg) } .fb.no { background: var(--bad-bg) }
.fb .v { font-weight: 600 }
.tip { background: var(--soft); border-radius: 10px; padding: 8px 12px; font-size: .92rem }
.why { display: grid; gap: 2px; background: var(--sheet); border-radius: 8px; padding: 8px 10px; }
.why .wl { font-weight: 600; font-size: .9rem; color: var(--muted) }
.skip { background: none; border: none; color: var(--muted); text-decoration: underline; font-size: .88rem; padding: 4px 6px; align-self: center }
.learns { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px }
.learn { border: 1.5px dashed var(--line); border-radius: 12px; padding: 10px 12px; font-size: .93rem }
.learn h3 { font-size: 1rem; margin-bottom: 4px }
.words { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 4px 16px; font-size: .95rem }
.tablebox { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-size: .93rem }
th, td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top }
th { background: var(--soft) }
/* activities */
.act { display: grid; gap: 10px }
.act .ah { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px }
.act .num { font-family: var(--display); font-weight: 800; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink); display: inline-grid; place-items: center; flex: none }
.act .ins { color: var(--muted); font-size: .9rem; font-style: italic }
.ab { min-width: 0; overflow-wrap: anywhere }
.ab .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding-block: 5px; border-bottom: 1px dotted var(--line) }
.ab .cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 22px }
.ab .cols2 > * { min-width: 0 }
.ab ol.l { margin: 0; padding-left: 1.4em; display: grid; gap: 8px }
.ab ol.cols2 { grid-template-columns: 1fr 1fr; column-gap: 28px }
.ab .wb { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px }
.ab .wb span { border: 1.5px solid var(--ink); border-radius: 999px; padding: 1px 10px; font-weight: 500; font-size: .92rem }
.ab .tr { color: var(--muted); font-style: italic; font-size: .9rem }
.ab .hint { color: var(--muted); font-size: .85rem }
.ab table.t { margin-top: 4px }
.ab [style*="border"] { border-color: var(--line) !important; }
.ab .q { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-left: auto }
.ab .q .opt { padding: 3px 10px; font-size: .88rem; min-width: 0; border-radius: 999px }
.ab .q input[type=text], .ab .q select { border: none; border-bottom: 2px solid var(--ink); background: var(--soft); border-radius: 6px 6px 0 0; padding: 3px 8px; min-width: 7.5em; max-width: 100% }
.ab .q.right input, .ab .q.right select { border-color: var(--good); background: var(--good-bg) }
.ab .q.wrong input, .ab .q.wrong select { border-color: var(--bad); background: var(--bad-bg) }
.ab .q .fix { color: var(--good); font-weight: 600; font-size: .88rem }
.ab li .q, .ab .row .q.inl { margin-left: 0 }
.score-chip { font-weight: 600; border-radius: 999px; padding: 2px 12px; background: var(--good-bg); color: var(--good) }
@media (max-width: 560px) { .ab .cols2, .ab ol.cols2 { grid-template-columns: 1fr } h1 { font-size: 1.6rem } }
/* finish */
.feel { display: flex; gap: 14px; flex-wrap: wrap }
.feel button { border: 2px solid var(--line); background: var(--sheet); border-radius: 16px; padding: 8px 14px; display: grid; justify-items: center; gap: 2px; font-size: .85rem }
.feel button[aria-pressed="true"] { border-color: var(--ink); background: var(--mark) }
.feel svg { width: 44px; height: 44px }
.rcode { font-family: var(--display); font-weight: 800; font-size: clamp(1.4rem, 6vw, 2.1rem); letter-spacing: .06em; background: var(--mark); border-radius: 12px; padding: 6px 14px; display: inline-block; user-select: all; overflow-wrap: anywhere }
.stickerbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: .9rem }
.prog { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; flex: 1; min-width: 120px }
.prog i { display: block; height: 100%; background: var(--accent); width: 0 }
.lightbox { position: fixed; inset: 0; background: rgba(10, 15, 25, .86); z-index: 20; overflow: auto; padding: max(16px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 16px max(12px, env(safe-area-inset-left, 0px)); }
.lightbox img { width: 100%; max-width: 1000px; display: block; margin: 0 auto; background: #fff; border-radius: 8px }
.lightbox button { position: sticky; top: 0; float: right; margin-bottom: 8px }
textarea { width: 100%; min-height: 120px; font: inherit; border: 1.5px solid var(--line); border-radius: 10px; padding: 8px; background: var(--sheet); color: var(--ink) }
footer { margin-top: 30px; font-size: .85rem; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap }
footer button { background: none; border: none; text-decoration: underline; color: var(--muted); padding: 0 }
@media (prefers-reduced-motion: no-preference) { .pop { animation: pop .25s ease-out } @keyframes pop { from { transform: scale(.96); opacity: .4 } to { transform: none; opacity: 1 } } }
</style>

</head><body><header class="top"><div class="wrap">
  <img src="logo.png" alt="Özel PEV Okulları">
  <div class="brand"><span id="bn">English Practice</span><small id="bs">Özel PEV Okulları · 8th grade</small></div>
  <div class="sp"></div>
  <span id="who"></span>
</div></header>
<main class="wrap" id="app"><p class="muted" style="padding-top:30px">Loading your sheets…</p></main>

<script>
(function () {
const SALT = 'pev8d-2026';
const app = document.getElementById('app'), who = document.getElementById('who');
let D = null, code = null;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('pev8d:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pev8d:' + k, JSON.stringify(v)); } catch (e) {} }
};
function chk(s) { let x = 2166136261; for (const ch of s + SALT) { x ^= ch.charCodeAt(0); x = Math.imul(x, 16777619) >>> 0; } return (x % 1296).toString(36).toUpperCase().padStart(2, '0'); }
const norm = s => String(s).toLowerCase().replace(/[’‘]/g, "'").replace(/[“”]/g, '"').replace(/[-\s]+/g, ' ').replace(/[.!?,;:]+$/g, '').trim();
const FACES = {
  H: '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="14" cy="16" r="2.2" fill="currentColor"/><circle cx="26" cy="16" r="2.2" fill="currentColor"/><path d="M12 24q8 8 16 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>',
  O: '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="14" cy="16" r="2.2" fill="currentColor"/><circle cx="26" cy="16" r="2.2" fill="currentColor"/><path d="M13 26h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>',
  S: '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="14" cy="16" r="2.2" fill="currentColor"/><circle cx="26" cy="16" r="2.2" fill="currentColor"/><path d="M12 29q8-7 16 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>'
};
const FEELW = { H: 'Great', O: 'OK', S: 'Not sure' };
const face = FACES.H.replace('<svg', '<svg class="face"');
function bubble(t) { return `<div class="bubble-row">${face}<div class="bubble">${t}</div></div>`; }

/* ---------- routing ---------- */
function route() {
  if (location.hash === '#teacher') return teacher();
  if (!D) return;
  const c = store.get('code', null);
  if (c && D.students[c]) { code = c; list(); } else home();
}
window.addEventListener('hashchange', route);
fetch('data.json').then(r => r.json()).then(j => { D = j; route(); }).catch(() => {
  app.innerHTML = '<p class="err" style="padding-top:30px">The sheets could not load. Check your internet connection and open the page again.</p>';
});
if (location.hash === '#teacher') teacher();

function setWho() {
  const g = code && D && D.groups ? D.groupInfo[D.groups[code]] : null;
  document.getElementById('bn').textContent = g ? g.short + ' English Practice' : 'English Practice';
  document.getElementById('bs').textContent = g ? 'Özel PEV Okulları · Teacher: ' + g.teacher : 'Özel PEV Okulları · 8th grade';
  who.innerHTML = code ? `<button class="btn small" id="out" type="button">Code ${esc(code)} · change</button>` : '';
  if (code) document.getElementById('out').onclick = () => { store.set('code', null); code = null; setWho(); home(); };
}

/* ---------- home ---------- */
function home() {
  code = null; setWho();
  app.innerHTML = `<section class="hero">
    <h1>Your English practice sheets</h1>
    ${bubble('Hi! After every exam, I prepare a sheet just for you. Type the <b>5-letter code</b> your teacher gave you to open your sheets.')}
    <form class="code-form" id="cf" autocomplete="off">
      <label for="ci" class="muted" style="width:100%">Your code</label>
      <input id="ci" class="code-input" maxlength="5" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="•••••">
      <button class="btn primary" type="submit">Open my sheets</button>
      <span id="ce" class="err" role="alert"></span>
    </form></section>
    <div class="how">
      <div class="sheet"><b>1 · Let's Remember</b><p class="muted" style="margin:4px 0 0">Look at the exam questions you missed and try them again.</p></div>
      <div class="sheet"><b>2 · Now It's Your Turn</b><p class="muted" style="margin:4px 0 0">Do the word activities and press <i>Check</i>.</p></div>
      <div class="sheet"><b>3 · Send your result</b><p class="muted" style="margin:4px 0 0">At the end you get a result code. Send it to your teacher.</p></div>
    </div>
    <footer><span>8. sınıflar · KUR İngilizce</span><button type="button" onclick="location.hash='teacher'">Öğretmen sayfası</button></footer>`;
  const ci = document.getElementById('ci');
  ci.addEventListener('input', () => ci.value = ci.value.toUpperCase().replace(/[^A-Z0-9]/g, ''));
  document.getElementById('cf').addEventListener('submit', e => {
    e.preventDefault();
    const c = ci.value.trim().toUpperCase();
    if (!D) return;
    if (!D.students[c]) { document.getElementById('ce').textContent = 'This code is not correct. Check the letters and try again.'; return; }
    code = c; store.set('code', c); list();
  });
}

/* ---------- list ---------- */
function list() {
  setWho(); window.scrollTo(0, 0);
  const st = D.students[code];
  const tiles = D.exams.filter(e => st[e.id]).map(e => {
    const r = st[e.id], done = store.get(`done:${code}:${e.id}`, null);
    const kind = r.absent ? 'Class sheet' : r.type === 'levelup' ? 'Level Up' : 'Practice';
    const info = r.absent ? 'You missed this exam' : `${r.D} correct · ${r.Y} wrong · ${r.B} blank`;
    return `<button class="tile" type="button" data-e="${e.id}">
      <span class="muted" style="font-size:.85rem">${esc(e.date)}</span>
      <span class="nm">${esc(e.name)}</span>
      <span><span class="badge ${r.type === 'levelup' ? 'lu' : ''}">${kind}</span> ${done ? '<span class="badge done">Done ✓</span>' : ''}</span>
      <span class="muted" style="font-size:.88rem">${info}</span>
      ${done ? `<span style="font-size:.85rem">Result code: <b>${esc(done.rc)}</b></span>` : ''}
    </button>`;
  }).join('');
  app.innerHTML = `<div class="stack" style="padding-top:26px">
    <h1>Choose a sheet</h1>
    ${bubble('Start with the oldest sheet you have not finished. Each sheet takes about 20–30 minutes.')}
    <div class="tiles">${tiles}</div></div>`;
  app.querySelectorAll('.tile').forEach(b => b.onclick = () => sheet(b.dataset.e));
}

/* ---------- sheet ---------- */
function sheet(eid) {
  window.scrollTo(0, 0);
  const ex = D.exams.find(e => e.id === eid), r = D.students[code][eid];
  const key = `st:${code}:${eid}`;
  const S = store.get(key, { rem: {}, acts: {}, feel: null });
  const save = () => store.set(key, S);
  const N = ex.n, ok = r.absent ? null : N - r.miss.length;
  let intro;
  if (r.absent) intro = `You missed this exam, so here are the <b>${r.miss.length} trickiest questions</b> for our class. Discover the little traps in them. When you see them in the next exam, you will catch them!`;
  else if (r.type === 'levelup') intro = r.miss.length ? `Great job! You got <b>${ok} out of ${N}</b> questions right. Let's have a quick check, then learn some new words.` : `<b>Perfect score!</b> You got <b>${N} out of ${N}</b> questions right. Amazing work! Here are some new words to take your English to the next level.`;
  else if (r.B >= 4) intro = `You got <b>${ok} out of ${N}</b> questions right, and you left <b>${r.B} questions blank</b>. Don't worry! Let's look at these questions together. You will see that you can do them!`;
  else intro = `You got <b>${ok} out of ${N}</b> questions right in the exam. Now discover the little traps that tricked you. Next time, you will catch them!`;

  const cards = r.miss.map((m, i) => {
    const q = ex.q[m.a];
    const yours = r.absent ? `<span class="badge">${m.wrong} of ${m.total} students missed it</span>` : `<span class="badge">Your answer in the exam: <b>${m.ans === '-' ? 'blank' : esc(m.ans)}</b></span>`;
    return `<div class="sheet card" data-a="${m.a}">
      <div class="hd"><span class="qn">Q${m.own}</span><h3>${esc(q.title)}</h3><span class="sp"></span>${yours}</div>
      <img class="qimg" src="img/${eid}_${m.a}.jpg" alt="Exam question ${m.own}" loading="lazy">
      <div><span class="muted" style="font-size:.9rem">Try it again. Which is the correct answer?</span>
      <div class="chips" style="margin-top:6px">${['A', 'B', 'C', 'D'].map(L => `<button class="opt" type="button" data-L="${L}">${L}</button>`).join('')}
      <button class="skip" type="button">I don't know. Show me the answer.</button></div></div>
      <div class="fbx"></div></div>`;
  }).join('');
  const learn = (r.learn || []).map(k => ex.learn[k]).filter(Boolean).map(([t, b]) => `<div class="learn"><h3>Learn more: ${esc(t)}</h3><div>${b}</div></div>`).join('');
  const vocab = r.vocab ? `<div class="sheet"><h3 style="margin-bottom:8px">Word box <span class="muted" style="font-size:.85rem;font-family:var(--body);font-weight:400">(ünite kelimeleri)</span></h3><div class="words">${r.vocab.map(([e, t]) => `<div><b>${esc(e)}</b> = ${esc(t)}</div>`).join('')}</div></div>` : '';
  const lu = r.type === 'levelup' ? `<div class="sheet"><h3 style="margin-bottom:8px">New words <span class="muted" style="font-size:.85rem;font-family:var(--body);font-weight:400">(yeni kelimeler)</span></h3>
      <div class="tablebox"><table><tr><th>Word</th><th>Türkçe</th><th>Example</th></tr>${ex.lu.words.map(([w, t, x]) => `<tr><td><b>${esc(w)}</b></td><td>${esc(t)}</td><td><i>${esc(x)}</i></td></tr>`).join('')}</table></div></div>
    <div class="sheet"><h3 style="margin-bottom:8px">Don't mix them up! <span class="muted" style="font-size:.85rem;font-family:var(--body);font-weight:400">(sık karıştırılan kalıplar)</span></h3>
      <div class="learns">
        <div class="learn"><h3>What is she like?</h3>Kişiliğini sorar.<br><i>She is kind and funny.</i><br><b>you:</b> <i>What are you like? — I'm friendly.</i></div>
        <div class="learn"><h3>What does she look like?</h3>Dış görünüşünü sorar.<br><i>She has long, curly hair.</i><br><b>you:</b> <i>What do you look like? — I'm tall.</i></div>
        <div class="learn"><h3>What does she like?</h3>Neleri sevdiğini sorar.<br><i>She likes reading and music.</i><br><b>you:</b> <i>What do you like? — I like football.</i></div>
      </div></div>` : '';
  const acts = r.acts.map((a, i) => `<div class="sheet act" data-i="${i}">
      <div class="ah"><span class="num">${i + 1}</span><h3>${esc(a.title)}</h3><span class="ins">(${esc(a.instr)})</span></div>
      <div class="ab">${a.html}</div>
      <div class="stickerbar"><button class="btn primary small chk" type="button">Check</button><span class="res"></span></div></div>`).join('');
  const remTitle = r.type === 'levelup' ? 'Quick check' : "Let's Remember";
  app.innerHTML = `<div class="stack" style="padding-top:20px">
    <div class="stickerbar"><button class="btn small" type="button" id="back">← My sheets</button><span class="muted">${esc(ex.name)} · ${r.absent ? 'Class sheet' : r.type === 'levelup' ? 'Level Up Sheet' : 'Practice Sheet'}</span>
      <span class="prog" aria-hidden="true"><i id="pg"></i></span><span id="pgt" class="muted" style="font-variant-numeric:tabular-nums"></span></div>
    ${bubble(intro)}
    ${r.miss.length ? `<div class="sec-head"><span class="pill">${remTitle}</span></div>${cards}` : ''}
    ${learn ? `<div class="learns">${learn}</div>` : ''}
    ${vocab}${r.type === 'levelup' ? `<div class="sec-head"><span class="pill">Level Up: New Words</span></div>${lu}` : ''}
    <div class="sec-head"><span class="pill">${r.type === 'levelup' ? 'Level Up: Challenge' : "Now It's Your Turn"}</span></div>
    ${acts}
    <div class="sec-head"><span class="pill">Finish</span></div>
    <div class="sheet stack" id="fin"></div></div>`;
  document.getElementById('back').onclick = list;
  app.querySelectorAll('.qimg').forEach(im => im.onclick = () => zoom(im.src));

  /* remember cards */
  app.querySelectorAll('.card').forEach(cd => {
    const a = cd.dataset.a, m = r.miss.find(x => String(x.a) === a), q = ex.q[a];
    const show = (first) => {
      cd.querySelectorAll('.opt').forEach(b => {
        b.classList.toggle('right', b.dataset.L === m.key);
        b.classList.toggle('wrong', b.dataset.L === first && first !== m.key);
        b.disabled = true;
      });
      const good = first === m.key, skipped = first === '?';
      const ex1 = m.ans, parts = [];
      if (!m.general && ex1 && ex1 !== '-' && ex1 !== m.key)
        parts.push(`<div class="why"><span class="wl">Sınavda <b>${esc(ex1)}</b> şıkkını seçmiştin. Neden yanlış?</span>${esc(q.why[ex1] || q.why['-'])}</div>`);
      else if (!m.general && ex1 === '-')
        parts.push(`<div class="why"><span class="wl">Sınavda bu soruyu boş bırakmıştın.</span>Aşağıdaki açıklamayı okuyup soruya bir daha bak.</div>`);
      if (!good && !skipped && first !== ex1 && q.why[first])
        parts.push(`<div class="why"><span class="wl">Şimdi <b>${esc(first)}</b> şıkkını seçtin. Neden yanlış?</span>${esc(q.why[first])}</div>`);
      parts.push(`<div class="why"><span class="wl">Doğru cevabı nasıl buluruz? (<b>${esc(m.key)}</b>)</span>${esc(q.why['-'])}</div>`);
      const head = good ? 'Correct! ✓' : skipped ? `The correct answer is <b>${esc(m.key)}</b>.` : `Not quite. The correct answer is <b>${esc(m.key)}</b>.`;
      cd.querySelector('.fbx').innerHTML = `<div class="fb ${good ? 'ok' : 'no'} pop"><span class="v">${head}</span>
        ${parts.join('')}${q.mini ? `<span class="tip"><b>Tip:</b> ${q.mini}</span>` : ''}</div>`;
      const sk = cd.querySelector('.skip'); if (sk) sk.hidden = true;
    };
    if (S.rem[a]) show(S.rem[a]);
    cd.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (S.rem[a]) return; S.rem[a] = b.dataset.L; save(); show(b.dataset.L); prog(); });
    cd.querySelector('.skip').onclick = () => { if (S.rem[a]) return; S.rem[a] = '?'; save(); show('?'); prog(); };
  });

  /* activities */
  app.querySelectorAll('.act').forEach(el => {
    const i = el.dataset.i, a = r.acts[i];
    const st = S.acts[i] || (S.acts[i] = { v: {}, checked: false });
    el.querySelectorAll('.q').forEach(qe => {
      const k = qe.dataset.i, it = a.items[k];
      if (qe.closest('li') || qe.closest('.row')?.textContent.trim().length > 60) qe.classList.add('inl');
      if (it.kind === 'choice') {
        qe.innerHTML = it.options.map((o, j) => `<button class="opt" type="button" data-j="${j}" aria-pressed="${st.v[k] == j}">${esc(o)}</button>`).join('');
        qe.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (st.checked) return; st.v[k] = +b.dataset.j; save(); qe.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed', x === b)); prog(); });
      } else if (it.kind === 'select') {
        qe.innerHTML = `<select id="s-${eid}-${i}-${k}" aria-label="Answer ${+k + 1}"><option value="">choose…</option>${it.options.map(o => `<option${st.v[k] === o ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
        qe.querySelector('select').onchange = e => { st.v[k] = e.target.value; save(); prog(); };
      } else {
        qe.innerHTML = `<input type="text" id="t-${eid}-${i}-${k}" aria-label="Answer ${+k + 1}" autocomplete="off" autocapitalize="none" spellcheck="false" value="${esc(st.v[k] || '')}">`;
        qe.querySelector('input').oninput = e => { st.v[k] = e.target.value; save(); };
        qe.querySelector('input').onchange = prog;
      }
    });
    const mark = () => {
      let c = 0;
      a.items.forEach((it, k) => {
        const qe = el.querySelector(`.q[data-i="${k}"]`); const v = st.v[k];
        let right;
        if (it.kind === 'choice') {
          right = v === it.answer;
          qe.querySelectorAll('.opt').forEach(b => { b.disabled = true; b.classList.toggle('right', +b.dataset.j === it.answer); b.classList.toggle('wrong', +b.dataset.j === v && !right); });
        } else {
          right = v != null && norm(v) === norm(it.answer);
          qe.classList.add(right ? 'right' : 'wrong');
          qe.querySelectorAll('input,select').forEach(x => x.disabled = true);
          if (!right) qe.insertAdjacentHTML('beforeend', `<span class="fix">→ ${esc(it.answer)}</span>`);
        }
        if (right) c++;
      });
      st.score = c;
      el.querySelector('.chk').hidden = true;
      el.querySelector('.res').innerHTML = `<span class="score-chip pop">${c} / ${a.items.length} correct${c === a.items.length ? ' · Super! ★' : ''}</span>`;
    };
    if (st.checked) mark();
    el.querySelector('.chk').onclick = () => {
      const empty = a.items.filter((_, k) => st.v[k] == null || st.v[k] === '').length;
      const res = el.querySelector('.res');
      if (empty && !res.dataset.warned) { res.dataset.warned = 1; res.innerHTML = `<span class="err">${empty} answer${empty > 1 ? 's are' : ' is'} empty. Press <i>Check</i> again to check anyway.</span>`; return; }
      st.checked = true; save(); mark(); prog();
    };
  });

  /* progress + finish */
  const total = r.miss.length + r.acts.reduce((s, a) => s + a.items.length, 0);
  function score() { return r.miss.filter(m => S.rem[m.a] === m.key).length + r.acts.reduce((s, a, i) => s + ((S.acts[i] && S.acts[i].checked) ? (S.acts[i].score || 0) : 0), 0); }
  function prog() {
    const parts = r.miss.length + r.acts.length;
    const doneN = r.miss.filter(m => S.rem[m.a]).length + r.acts.filter((a, i) => S.acts[i] && S.acts[i].checked).length;
    document.getElementById('pg').style.width = (100 * doneN / parts) + '%';
    document.getElementById('pgt').textContent = `${doneN}/${parts} done`;
    fin();
  }
  function fin() {
    const box = document.getElementById('fin');
    const openRem = r.miss.filter(m => !S.rem[m.a]).length, openActs = r.acts.filter((a, i) => !(S.acts[i] && S.acts[i].checked)).length;
    const done = store.get(`done:${code}:${eid}`, null);
    const sc = score();
    const rc = `${code}-${eid.toUpperCase()}-${sc}-${total}-${S.feel || 'X'}`;
    const full = rc + '-' + chk(rc);
    box.innerHTML = `<h3>How do you feel now?</h3>
      <div class="feel">${['H', 'O', 'S'].map(f => `<button type="button" data-f="${f}" aria-pressed="${S.feel === f}">${FACES[f]}<span>${FEELW[f]}</span></button>`).join('')}</div>
      ${openRem + openActs ? `<p class="muted" style="margin:0">Still open: ${openRem ? `${openRem} question${openRem > 1 ? 's' : ''} in ${remTitle}` : ''}${openRem && openActs ? ' and ' : ''}${openActs ? `${openActs} activit${openActs > 1 ? 'ies' : 'y'} to check` : ''}. Finish them for a better score.</p>` : `<p style="margin:0"><b>Everything is done.</b> Well done!</p>`}
      <div><button class="btn primary" type="button" id="mk" ${S.feel ? '' : 'disabled'}>${done ? 'Update my result code' : 'Get my result code'}</button>
      ${S.feel ? '' : '<span class="muted" style="font-size:.9rem"> Choose a face first.</span>'}</div>
      <div id="rcb">${done ? resultBlock(done) : ''}</div>`;
    box.querySelectorAll('.feel button').forEach(b => b.onclick = () => { S.feel = b.dataset.f; save(); fin(); });
    const mk = document.getElementById('mk');
    if (mk) mk.onclick = () => { const d = { rc: full, score: sc, total }; store.set(`done:${code}:${eid}`, d); fin(); document.getElementById('rcb').scrollIntoView({ block: 'nearest' }); };
    const cp = document.getElementById('cp');
    if (cp) cp.onclick = () => {
      const t = document.getElementById('rct').textContent;
      const ok = () => cp.textContent = 'Copied ✓';
      try { navigator.clipboard.writeText(t).then(ok, () => sel()); } catch (e) { sel(); }
      function sel() { const rg = document.createRange(); rg.selectNodeContents(document.getElementById('rct')); const s = getSelection(); s.removeAllRanges(); s.addRange(rg); cp.textContent = 'Selected: copy it now'; }
    };
  }
  function resultBlock(d) {
    return `<div class="stack pop" style="gap:10px;margin-top:6px"><p style="margin:0">Your score: <b>${d.score} / ${d.total}</b>. Send this result code to your teacher:</p>
      <div><span class="rcode" id="rct">${esc(d.rc)}</span></div><div><button class="btn small" type="button" id="cp">Copy code</button></div></div>`;
  }
  prog();
}

function zoom(src) {
  const lb = document.createElement('div'); lb.className = 'lightbox';
  lb.innerHTML = `<button class="btn" type="button">Close ✕</button><img src="${src}" alt="Exam question, large">`;
  lb.onclick = e => { if (e.target === lb || e.target.tagName === 'BUTTON') lb.remove(); };
  document.body.appendChild(lb); lb.querySelector('button').focus();
}

/* ---------- teacher (Turkish) ---------- */
function teacher() {
  code = null; setWho(); window.scrollTo(0, 0);
  const roster = store.get('roster', '');
  const codes = store.get('rcodes', '');
  app.innerHTML = `<div class="stack" style="padding-top:22px">
    <div class="stickerbar"><button class="btn small" type="button" id="tb">← Öğrenci girişi</button></div>
    <h1>Öğretmen sayfası</h1>
    <p class="muted" style="margin:0;max-width:62ch">Öğrencilerin gönderdiği sonuç kodlarını yapıştırın; tablo kendiliğinden oluşur. İsimler sayfada saklanmaz: kod listesini bir kez yapıştırırsanız yalnızca bu tarayıcıda hatırlanır.</p>
    <div class="sheet stack"><label for="rs"><b>Kod listesi</b> <span class="muted">(her satıra: KOD Ad Soyad)</span></label>
      <textarea id="rs" spellcheck="false" placeholder="ABCDE Ad Soyad">${esc(roster)}</textarea></div>
    <div class="sheet stack"><label for="rc"><b>Sonuç kodları</b> <span class="muted">(istediğiniz kadar; satır satır ya da mesajdan olduğu gibi)</span></label>
      <textarea id="rc" spellcheck="false" placeholder="ABCDE-D3-41-52-H-7F">${esc(codes)}</textarea></div>
    <div class="sheet" id="tt"></div></div>`;
  document.getElementById('tb').onclick = () => { history.replaceState(null, '', location.pathname); route(); if (!D) home(); };
  const rs = document.getElementById('rs'), rc = document.getElementById('rc');
  const draw = () => {
    store.set('roster', rs.value); store.set('rcodes', rc.value);
    const names = {}; rs.value.split(/\n/).forEach(l => { const m = l.trim().match(/^([A-Z0-9]{5})\s+(.+)$/i); if (m) names[m[1].toUpperCase()] = m[2].trim(); });
    const EXN = { D1: 'Deneme 1', D2: 'Deneme 2', D3: 'Deneme 3', D4: 'Deneme 4', D5: 'Deneme 5', T1: 'Tarama 1' };
    const found = [...rc.value.toUpperCase().matchAll(/\b([A-Z0-9]{5})-(D\d|T\d)-(\d+)-(\d+)-([HOSX])-([A-Z0-9]{2})\b/g)];
    const best = {};
    found.forEach(m => {
      const base = m.slice(1, 6).join('-'); const valid = chk(base) === m[6];
      const k = m[1] + m[2]; const row = { c: m[1], e: m[2], s: +m[3], t: +m[4], f: m[5], valid };
      if (!best[k] || (row.valid && row.s >= best[k].s)) best[k] = row;
    });
    const rows = Object.values(best).sort((a, b) => a.e.localeCompare(b.e) || (names[a.c] || a.c).localeCompare(names[b.c] || b.c, 'tr'));
    const fw = { H: 'İyi', O: 'Orta', S: 'Emin değil', X: '—' };
    document.getElementById('tt').innerHTML = rows.length ? `<div class="tablebox"><table>
      <tr><th>Sınav</th><th>Öğrenci</th><th>Puan</th><th>%</th><th>His</th><th>Kontrol</th></tr>
      ${rows.map(r => `<tr><td>${EXN[r.e] || r.e}</td><td>${esc(names[r.c] || r.c)}</td><td style="font-variant-numeric:tabular-nums">${r.s} / ${r.t}</td><td style="font-variant-numeric:tabular-nums">${Math.round(100 * r.s / r.t)}</td><td>${fw[r.f]}</td>
      <td>${r.valid ? '<span class="badge done">geçerli</span>' : '<span class="badge" style="color:var(--bad);border-color:var(--bad)">kod hatalı</span>'}</td></tr>`).join('')}</table></div>
      <p class="muted" style="margin:8px 0 0;font-size:.85rem">${rows.length} sonuç. Aynı öğrenci aynı sınavı birden çok gönderdiyse en yüksek geçerli puan gösterilir. "Kod hatalı" yazan satırlar yanlış yazılmış ya da değiştirilmiş olabilir.</p>`
      : '<p class="muted" style="margin:0">Sonuç kodu yapıştırdığınızda tablo burada görünecek.</p>';
  };
  rs.oninput = draw; rc.oninput = draw; draw();
}
})();
</script>
